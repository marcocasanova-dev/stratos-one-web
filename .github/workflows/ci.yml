name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    name: Type check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The same command the deploy workflow runs, so a PR cannot merge
      # something that would fail on main.
      - run: npm run build
